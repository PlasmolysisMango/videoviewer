name: javdb_app
description: JavDB video search, playback, and download app.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  video_player: ^2.8.1
  pointer_interceptor: ^0.10.1
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# 画面拉伸修复：video_player_android 2.8.15~2.12.1 会把变形宽高比视频
# （anamorphic，PAR≠1）的 coded size 当作显示尺寸上报，导致画面被拉伸
# （flutter/flutter#132934）。官方在 2.12.2 修复，但该版要求 Flutter >= 3.44
# （本项目 CI 为 3.32.5），故 vendor 2.8.15 并回移官方修复，见
# third_party/video_player_android 中 TextureExoPlayerEventListener 的
# [videoviewer] 补丁块。待 Flutter SDK 升级到 3.44+ 后可移除本 override。
#
# 移动网络加载限制（[videoviewer] 扩展）：同一 vendored 插件内新增
# DataSaver（开关/档位状态）、DataSaverLoadControl（动态缓冲水位，
# 10/20/30/60s 档）与 DataSaverDataSource（下载限速 1/2/3/5 MB/s），
# 经 videoviewer/data_saver 通道由设置页控制；上游 video_player 无
# 缓冲配置 API（flutter/flutter#141511、#40931），无法用依赖替代。
dependency_overrides:
  video_player_android:
    path: ../third_party/video_player_android
