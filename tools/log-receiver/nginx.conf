# Nginx configuration for log receiver
# Add this to your nginx sites-available or conf.d directory

server {
    listen 9091;  # Use a different port than the log receiver itself
    server_name _;

    # Log upload endpoint
    location /api/upload-log {
        # Only allow POST
        limit_except POST {
            deny all;
        }

        # Max body size: 1MB
        client_max_body_size 1m;

        # Proxy to log receiver service
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:9090;
    }

    # CORS headers for Flutter app
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
