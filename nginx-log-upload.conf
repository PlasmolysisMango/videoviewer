# Nginx configuration for log upload endpoint
# Add this to your nginx server block

# Log upload endpoint
location /api/upload-log {
    # Only allow POST requests
    limit_except POST {
        deny all;
    }

    # Set max body size for log uploads (1MB should be enough)
    client_max_body_size 1m;

    # Store logs in a directory
    alias /var/log/videoviewer/uploads/;

    # Generate unique filename based on timestamp
    # Note: nginx doesn't support dynamic filenames easily
    # We'll use a simple approach with proxy_pass to a backend or
    # use openresty/lua for dynamic naming

    # Alternative: Use a simple file with append mode
    # This requires ngx_http_log_module or lua-nginx-module
    
    # For simplicity, we'll use a basic approach:
    # Accept the log and store it with a fixed name (latest log)
    # Or use lua-nginx-module for dynamic naming
    
    # Simple approach: return 200 and log the request
    # The actual storage would need a backend service or lua script
    
    return 200 '{"status": "ok"}';
    add_header Content-Type application/json;
}

