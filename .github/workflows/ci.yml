name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.25'
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Go tests and linting
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  # Flutter analysis
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: ./flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        working-directory: ./flutter_app
        run: dart format --output=none --set-exit-if-changed .

  # Build check for Go server
  build-server:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server
        run: go build -o javdbserver ./cmd/javdbserver

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: javdbserver-linux
          path: javdbserver

  # Build check for Flutter
  build-flutter:
    runs-on: ubuntu-latest
    needs: [flutter-analyze]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: ./flutter_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
