name: Build Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  FLUTTER_VERSION: '3.32.5'

jobs:
  # Build the Windows release: Flutter app with the Go server binary placed
  # alongside it in the same folder (single artifact, ready to run).
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows server
        run: go build -ldflags="-s -w" -o javdbserver.exe ./cmd/javdbserver

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: ./flutter_app
        run: flutter build windows --release

      - name: Bundle server into the app folder
        shell: pwsh
        run: >
          Copy-Item javdbserver.exe
          flutter_app/build/windows/x64/runner/Release/javdbserver.exe

      - name: Upload Windows bundle (app + server)
        uses: actions/upload-artifact@v4
        with:
          name: videoviewer-windows
          path: flutter_app/build/windows/x64/runner/Release/

  # Build the Flutter app for Android with the Go server embedded via gomobile.
  # The AAR is built in-place and never published as a standalone artifact.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build gomobile AAR (embedded, not published)
        run: |
          mkdir -p flutter_app/android/app/libs
          gomobile bind \
            -target=android/arm64 \
            -androidapi=21 \
            -o=flutter_app/android/app/libs/goserver.aar \
            ./pkg/goserver

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-36"

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > flutter_app/android/app/release-key.jks
          cat > flutter_app/android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android APK (arm64-v8a only)
        working-directory: ./flutter_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  # Create release with all artifacts
  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archives
        run: |
          # Windows release: single folder with the Flutter app + javdbserver.exe
          mkdir -p release/windows
          cp -r videoviewer-windows/* release/windows/
          cd release/windows && zip -r ../../videoviewer-windows-x64.zip . && cd ../..

          # Android release (Flutter app with embedded Go server)
          mkdir -p release/android
          cp flutter-app-android-apk/app-release.apk release/android/videoviewer.apk
          cd release/android && zip -r ../../videoviewer-android.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            videoviewer-windows-x64.zip
            videoviewer-android.zip
          generate_release_notes: true
