name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Build Go HTTP Server for Windows
  build-server-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows server
        run: |
          go build -ldflags="-s -w" -o javdbserver.exe ./cmd/javdbserver
      
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: javdbserver-windows
          path: javdbserver.exe

  # Build Go HTTP Server for Linux (for Android)
  build-server-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Android server (arm64-v8a)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o javdbserver-android-arm64 ./cmd/javdbserver

      - name: Upload Android server
        uses: actions/upload-artifact@v4
        with:
          name: javdbserver-android
          path: javdbserver-android-arm64

  # Build Flutter app for Windows
  build-flutter-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: ./flutter_app
        run: flutter build windows --release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-windows
          path: flutter_app/build/windows/x64/runner/Release/

  # Build Flutter app for Android
  build-flutter-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android APK (arm64-v8a only)
        working-directory: ./flutter_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Build Android App Bundle (arm64-v8a only)
        working-directory: ./flutter_app
        run: flutter build appbundle --release --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  # Create release with all artifacts
  create-release:
    needs: [build-server-windows, build-server-android, build-flutter-windows, build-flutter-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archives
        run: |
          # Windows release
          mkdir -p release/windows
          cp javdbserver-windows/javdbserver.exe release/windows/
          cp -r flutter-app-windows/* release/windows/
          cd release/windows && zip -r ../../javdb-windows-x64.zip . && cd ../..

          # Android release
          mkdir -p release/android
          cp javdbserver-android/* release/android/
          cp flutter-app-android-apk/app-release.apk release/android/javdb.apk
          cd release/android && zip -r ../../javdb-android.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            javdb-windows-x64.zip
            javdb-android.zip
          generate_release_notes: true
