name: Build Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Build Go HTTP Server for Windows
  build-server-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows server
        run: |
          go build -ldflags="-s -w" -o javdbserver.exe ./cmd/javdbserver
      
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: javdbserver-windows
          path: javdbserver.exe

  # Build gomobile AAR for Android (embedded Go server)
  build-gomobile-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('flutter_app/android/app/build.gradle') }}

      - name: Cache gomobile
        id: cache-gomobile
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: ${{ runner.os }}-gomobile-${{ hashFiles('go.sum') }}

      - name: Install gomobile
        if: steps.cache-gomobile.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build gomobile AAR
        run: |
          mkdir -p flutter_app/android/app/libs
          gomobile bind \
            -target=android/arm64 \
            -androidapi=21 \
            -o=flutter_app/android/app/libs/goserver.aar \
            ./pkg/goserver

      - name: Upload gomobile AAR
        uses: actions/upload-artifact@v4
        with:
          name: gomobile-aar
          path: flutter_app/android/app/libs/goserver.aar

  # Build Flutter app for Windows
  build-flutter-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: ./flutter_app
        run: flutter build windows --release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-windows
          path: flutter_app/build/windows/x64/runner/Release/

  # Build Flutter app for Android (with embedded Go server)
  build-flutter-android:
    runs-on: ubuntu-latest
    needs: [build-gomobile-android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('flutter_app/android/app/build.gradle') }}

      - name: Download gomobile AAR
        uses: actions/download-artifact@v4
        with:
          name: gomobile-aar
          path: flutter_app/android/app/libs/

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > flutter_app/android/app/release-key.jks
          cat > flutter_app/android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Get Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Android APK (arm64-v8a only)
        working-directory: ./flutter_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Build Android App Bundle (arm64-v8a only)
        working-directory: ./flutter_app
        run: flutter build appbundle --release --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  # Create release with all artifacts
  create-release:
    needs: [build-server-windows, build-flutter-windows, build-flutter-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archives
        run: |
          # Windows release (Flutter app + server + start script)
          mkdir -p release/windows
          cp javdbserver-windows/javdbserver.exe release/windows/
          cp -r flutter-app-windows/* release/windows/
          cp scripts/start.bat release/windows/
          cd release/windows && zip -r ../../videoviewer-windows-x64.zip . && cd ../..

          # Android release (Flutter app with embedded Go server)
          mkdir -p release/android
          cp flutter-app-android-apk/app-release.apk release/android/videoviewer.apk
          cd release/android && zip -r ../../videoviewer-android.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            videoviewer-windows-x64.zip
            videoviewer-android.zip
          generate_release_notes: true
